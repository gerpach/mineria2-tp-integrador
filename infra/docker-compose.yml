# Cassandra local para correr el serving sin AstraDB (alternativa de demo, consigna 8.4).
# Uso: docker compose -f infra/docker-compose.yml up -d   (esperar ~60 s a que acepte conexiones)
services:
  cassandra:
    image: cassandra:4.1
    container_name: tp_cassandra
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
